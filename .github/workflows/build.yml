name: Pipeline de Calidad y Seguridad (Sonar, Semgrep, Trivy)

on:
  push:
    branches: [ main, master ]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # -----------------------------------------------------------------
  # JOB 1: SONARCLOUD & TESTS
  # -----------------------------------------------------------------
  sonarcloud:
    name: SonarCloud & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0 
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'zulu'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.35.2'
      - name: Install dependencies
        run: flutter pub get
      - name: Create Dummy Service Account
        run: |
          mkdir -p assets/keys
          echo '{}' > assets/keys/service_account.json
      - name: Run Tests with Coverage
        run: flutter test --coverage --dart-define=API_TOKEN="${{ secrets.API_TOKEN }}"
      - name: Fix Coverage Paths
        run: sed -i "s|SF:lib/|SF:$GITHUB_WORKSPACE/lib/|g" coverage/lcov.info
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            "-Dsonar.organization=cdhm"
            "-Dsonar.projectKey=dennisdhm7_proyecto_sosmascota"
            "-Dsonar.sources=lib"
            "-Dsonar.tests=test"
            "-Dsonar.dart.lcov.reportPaths=coverage/lcov.info"
            "-Dsonar.coverage.reportPaths=coverage/lcov.info"
            "-Dsonar.exclusions=test/**/*,lib/**/*.g.dart,lib/firebase_options.dart"

  # -----------------------------------------------------------------
  # JOB 2: SEMGREP
  # -----------------------------------------------------------------
  security-semgrep:
    name: Security - Semgrep
    runs-on: ubuntu-latest
    if: (github.actor != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@v3
      - name: Run Semgrep
        run: |
          docker run --rm -v "${PWD}:/src" returntocorp/semgrep \
          semgrep scan --config=p/default --config=p/security-audit --config=p/secrets --sarif -o /src/semgrep.sarif
      - name: Install SARIF Tools
        run: pip install sarif-tools
      - name: Convert SARIF to HTML
        run: sarif html semgrep.sarif
      
      # [MEJORA] Inyectar un título personalizado al HTML de Semgrep usando sed
      - name: Customize Semgrep HTML
        run: |
          mv semgrep.html temp.html
          sed 's|<body>|<body><div style="background:#008080;color:white;padding:15px;text-align:center"><h1>🛡️ SOS Mascota - Semgrep Report</h1></div>|' temp.html > semgrep-report.html

      - name: Upload Semgrep HTML
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-html
          path: semgrep-report.html

  # -----------------------------------------------------------------
  # JOB 3: TRIVY (PERSONALIZADO)
  # -----------------------------------------------------------------
  security-trivy:
    name: Security - Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Trivy CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https gnupg lsb-release
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install trivy -y
      
      # [CAMBIO] Usamos la plantilla local 'assets/trivy-custom.tpl'
      - name: Run Trivy with Custom Template
        run: |
          trivy fs . --format template --template "@assets/trivy-custom.tpl" --output trivy-report.html --severity CRITICAL,HIGH --ignore-unfixed || true

      - name: Upload Trivy Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trivy-html
          path: trivy-report.html

  # -----------------------------------------------------------------
  # JOB 4: GENERATE-REPORT
  # -----------------------------------------------------------------
  generate-report:
    name: Generate Risk Report
    runs-on: ubuntu-latest
    needs: sonarcloud
    steps:
      - uses: actions/checkout@v3
      - name: Install .NET SDK 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool
      - name: Add ReportGenerator to Path
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
      - name: Copy lcov.info
        run: cp ${{ github.workspace }}/coverage/lcov.info .
      - name: Run ReportGenerator
        run: reportgenerator -reports:lcov.info -targetdir:coverage_risk_html -reporttypes:Html
      - name: Upload Risk Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: risk-coverage-report
          path: coverage_risk_html

  # -----------------------------------------------------------------
  # JOB 5: BUILD & DEPLOY DOCS (CONSOLIDACIÓN)
  # -----------------------------------------------------------------
  build-docs:
    name: Build Portal & Deploy
    runs-on: ubuntu-latest
    needs: [sonarcloud, security-trivy, security-semgrep, generate-report]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.35.2'
      - name: Install dependencies
        run: flutter pub get
      - name: Generate Dart API Docs
        run: dart doc .

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts 

      - name: Assemble Site
        run: |
          mkdir _site
          mkdir -p _site/reports
          mkdir -p _site/reports/risk_report
          
          # 1. Mover DartDocs
          mv doc/api _site/dartdoc
          
          # 2. Mover Risk Report
          mv artifacts/risk-coverage-report/* _site/reports/risk_report/
          
          # 3. Mover Semgrep (validando existencia)
          if [ -f artifacts/semgrep-html/semgrep-report.html ]; then
            mv artifacts/semgrep-html/semgrep-report.html _site/reports/semgrep.html
          else
             echo "<h1>Reporte Semgrep no encontrado</h1>" > _site/reports/semgrep.html
          fi

          # 4. Mover Trivy (validando existencia)
          if [ -f artifacts/trivy-html/trivy-report.html ]; then
            mv artifacts/trivy-html/trivy-report.html _site/reports/trivy.html
          else
             echo "<h1>Reporte Trivy no encontrado</h1>" > _site/reports/trivy.html
          fi

          # 5. [CAMBIO] Copiar el Dashboard local en lugar del echo gigante
          # Asumimos que guardaste el archivo del Paso 2 en 'assets/dashboard.html'
          cp assets/dashboard.html _site/index.html

          # Limpieza
          rm -rf artifacts doc

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site' 

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-docs
    environment:
      name: github-pages 
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4